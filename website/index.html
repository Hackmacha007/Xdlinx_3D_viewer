<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="assets/images/astravector_logo.svg">

    <title>AstraVector 3D Studio — Next-Gen CAD Engine & AutoCAD Studio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- website start -->
    <link rel="stylesheet" type="text/css" href="../build/website_dev/o3dv.website.min.css">
    <script type="text/javascript" src="../build/website_dev/o3dv.website.min.js"></script>
    <!-- website end -->

    <script type="text/javascript">
        OV.SetWebsiteEventHandler ((eventName, eventLabel, eventParams) => {
            console.log ({
                eventName : eventName,
                eventLabel : eventLabel,
                eventParams : eventParams
            });
        });
    </script>

    <script type="text/javascript">
        OV.StartWebsite ();
    </script>

    <style>
        /* AstraVector Studio Modern Header Theme */
        div.header {
            background: #090b10 !important;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3) !important;
        }

        .astra-brand-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            padding: 4px 8px;
        }

        .astra-brand-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.8px;
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .astra-brand-title .main-title {
            background: linear-gradient(135deg, #00f0ff 0%, #00ff9d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .astra-brand-title .sub-title {
            color: #ffffff;
            font-weight: 600;
        }

        .astra-pill {
            font-size: 9px;
            background: rgba(0, 240, 255, 0.15);
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 3px 7px;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body class="dark-theme">
    <input type="file" id="open_file" style="display:none;" multiple></input>
    <div class="header" id="header">
        <div class="title">
            <div class="title_left">
                <a href="index.html" class="astra-brand-badge">
                    <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
                        <path d="M18 3L4 11L18 19L32 11L18 3Z" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M4 25L18 33L32 25" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M4 18L18 26L32 18" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3"/>
                        <circle cx="18" cy="11" r="3" fill="#00f0ff"/>
                    </svg>
                    <div class="astra-brand-title">
                        <span class="main-title">ASTRAVECTOR</span>
                        <span class="sub-title">3D STUDIO</span>
                        <span class="astra-pill">PRO CAD</span>
                    </div>
                </a>
            </div>
            <div class="title_right" id="header_buttons"></div>
            <div class="main_file_name only_full_width" id="main_file_name"></div>
        </div>
        <div class="toolbar" id="toolbar"></div>
    </div>
    <div class="main" id="main">
        <div class="main_left_container only_full_width" id="main_left_container">
            <div class="main_navigator ov_panel_set_container" id="main_navigator"></div>
            <div class="main_splitter" id="main_navigator_splitter"></div>
        </div>
        <div class="main_viewer" id="main_viewer"></div>
        <div class="main_right_container only_full_width" id="main_right_container">
            <div class="main_splitter" id="main_sidebar_splitter"></div>
            <div class="main_sidebar ov_panel_set_right_container" id="main_sidebar"></div>
        </div>
    </div>
    <div class="intro ov_thin_scrollbar" id="intro">
        <div class="intro_content" id="intro_content">
            <div class="intro_logo">
                <div style="display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:16px;">
                    <svg width="72" height="72" viewBox="0 0 36 36" fill="none">
                        <path d="M18 3L4 11L18 19L32 11L18 3Z" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M4 25L18 33L32 25" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M4 18L18 26L32 18" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3"/>
                        <circle cx="18" cy="11" r="3" fill="#00f0ff"/>
                    </svg>
                    <div style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: 1px;">
                        <span style="background: linear-gradient(135deg, #00f0ff 0%, #00ff9d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ASTRAVECTOR</span>
                        <span style="color: #ffffff;"> 3D STUDIO</span>
                    </div>
                    <div style="font-size: 14px; color: #94a3b8; font-family: 'Inter', sans-serif; font-weight: 600;">Next-Generation 3D CAD Engine & Automated AutoCAD 2D Studio</div>
                </div>
                <div class="intro_dragdrop_text" id="intro_dragdrop_text"></div>
            </div>
            <div class="intro_formats">
                <div class="intro_formats_title" id="intro_formats_title"></div>
                <div class="intro_file_formats">
                    <a href="#model=assets/models/RhinoLogo.3dm">3dm</a>
                    <a href="#model=assets/models/cubes.3ds,assets/models/texture.png">3ds</a>
                    <a href="#model=assets/models/rhombicuboctahedron.3mf">3mf</a>
                    <a href="#model=assets/models/rook.amf">amf</a>
                    <a href="#model=assets/models/MultipleMeshes.bim">bim</a>
                    <a href="#model=assets/models/as1_pe_203.brep">brep</a>
                    <a href="#model=assets/models/X_Bot.dae">dae</a>
                    <a href="#model=assets/models/Y_Bot.fbx">fbx</a>
                    <a href="#model=assets/models/ArchDetail.FCStd">fcstd</a>
                    <a href="#model=assets/models/DamagedHelmet.glb">gltf</a>
                    <a href="#model=assets/models/haus.ifc">ifc</a>
                    <a href="#model=assets/models/as1_pe_203.igs">iges</a>
                    <a href="#model=assets/models/as1_pe_203.stp">step</a>
                    <a href="#model=assets/models/utah_teapot.stl">stl</a>
                    <a href="#model=assets/models/solids.obj,assets/models/solids.mtl">obj</a>
                    <a href="#model=assets/models/cube.off">off</a>
                    <a href="#model=assets/models/cow.ply">ply</a>
                    <a href="#model=assets/models/extrusion3.wrl">wrl</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
